name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency audit of production dependencies (fails on high or critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit of dev tooling (report only)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Create disposable TLS certificate for the API tests
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout certs/localhost-key.pem -out certs/localhost-cert.pem \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
      - name: Backend tests
        run: npm test
      - name: Newman API tests
        run: npm run test:newman
      - name: Build backend container
        working-directory: .
        run: docker build --tag hustlehub-backend:ci ./backend
