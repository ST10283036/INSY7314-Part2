name: Frontend checks

on:
  push:
    branches: [main, develop, feature/role3-part3]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, test and build the frontend
        working-directory: frontend
        run: npm run verify
      - name: Build frontend container (includes lint and tests)
        run: docker build --tag hustlehub-frontend:ci ./frontend
      - name: Create disposable local TLS certificate
        run: |
          mkdir -p "$RUNNER_TEMP/hustlehub-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/hustlehub-tls/localhost-key.pem" \
            -out "$RUNNER_TEMP/hustlehub-tls/localhost-cert.pem" \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
      - name: Run frontend container and check HTTPS, SPA routes and CSP
        run: |
          docker run -d --name frontend-smoke --add-host backend:127.0.0.1 \
            -p 127.0.0.1:8443:8443 \
            -v "$RUNNER_TEMP/hustlehub-tls:/etc/nginx/certs:ro" hustlehub-frontend:ci
          curl --retry 10 --retry-connrefused --retry-delay 2 --fail \
            --cacert "$RUNNER_TEMP/hustlehub-tls/localhost-cert.pem" https://localhost:8443/healthz
          curl --fail --cacert "$RUNNER_TEMP/hustlehub-tls/localhost-cert.pem" \
            https://localhost:8443/income | grep 'id="root"'
          curl --fail --cacert "$RUNNER_TEMP/hustlehub-tls/localhost-cert.pem" \
            --head https://localhost:8443/ | grep -i 'content-security-policy:'
      - name: Frontend container logs
        if: always()
        run: docker logs frontend-smoke 2>&1 || true
      - name: Upload frontend verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-verification
          path: security/evidence/part3-frontend-checks.json
          if-no-files-found: warn
      - name: Stop frontend container
        if: always()
        run: docker rm -f frontend-smoke || true
